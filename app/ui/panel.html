<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ComfyUI 状态</title>
<style>
:root {
  color-scheme: light; /* iframe 画布底色由根元素 color-scheme 决定：不明写就恒为白 */
  --text: #2b2b2b; --text-muted: #888; --accent: #537d96;
  --bg-card: rgba(127,127,127,.06); --border: rgba(127,127,127,.2);
  --ok: #2e7d32; --bad: #c62828; --gold: #b8860b;
}
/* 2026-10-11 修复：面板主题不跟随（整块白底）。
   body 是透明底，白块来自 iframe 自身画布（UA 默认底色）——它只看**根元素** color-scheme，
   body 上的 class 管不到；这里把 t-dark 同时挂到 :root（JS 同步切换 html 与 body）。 */
:root.t-dark { color-scheme: dark; }
body.t-dark {
  --text: #d8d8d8; --text-muted: #8a8a8a; --accent: #7fa8c0;
  --bg-card: rgba(255,255,255,.06); --border: rgba(255,255,255,.14);
  --ok: #6fbf73; --bad: #e57373; --gold: #d4af37;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 10px 12px; background: transparent; color: var(--text); font: 12px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
h1 { font-size: 13px; font-weight: 700; margin: 0 0 8px; }
.sect { margin-bottom: 10px; }
.row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 0.5px dashed var(--border); }
.row:last-child { border-bottom: 0; }
.k { color: var(--text-muted); flex: 0 0 auto; }
.v { text-align: right; word-break: break-all; font-variant-numeric: tabular-nums; }
.chip { font-size: 10.5px; padding: 1px 8px; border-radius: 999px; background: rgba(127,127,127,.14); color: var(--text-muted); white-space: nowrap; }
.chip.ok { background: rgba(46,125,50,.18); color: var(--ok); }
.chip.bad { background: rgba(198,40,40,.16); color: var(--bad); }
.chip.warn { background: rgba(180,120,30,.18); color: #9c6b1e; }
button { font-size: 11.5px; padding: 4px 12px; border-radius: 7px; cursor: pointer; border: 0.5px solid var(--border); background: var(--bg-card); color: var(--accent); width: 100%; }
button:hover { background: var(--accent); color: #fff; }
.note { color: var(--text-muted); font-size: 11px; margin-top: 8px; line-height: 1.6; }
.err { color: var(--bad); font-size: 11px; word-break: break-all; margin-top: 6px; }
/* ── 主机指标区（GPU/CPU/内存；任务管理器风格曲线）── */
.mon-sec { font-size: 12px; font-weight: 600; margin: 12px 0 8px; display: flex; align-items: center; gap: 8px; }
.sec-spacer { flex: 1; }
.gpu-release {
  font-size: 11px; font-weight: 500; padding: 3px 12px; border-radius: 999px; cursor: pointer;
  border: 0.5px solid var(--border); background: var(--bg-card); color: var(--bad);
  transition: background .15s, color .15s, border-color .15s;
}
.gpu-release:hover { background: var(--bad); border-color: var(--bad); color: #fff; }
.gpu-release.loading { opacity: .55; cursor: default; }
/* ── 服务起停按钮组（启动 / 停止 ComfyUI 本体，不是中继）── */
.btn-row { display: flex; gap: 6px; }
.btn-row button { flex: 1; }
button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
button.primary:hover { filter: brightness(1.08); background: var(--accent); color: #fff; }
button.danger { color: var(--bad); border-color: var(--bad); }
button.danger:hover { background: var(--bad); border-color: var(--bad); color: #fff; }
button[disabled] { opacity: .5; cursor: default; }
button[disabled]:hover { background: var(--bg-card); color: var(--accent); }
.chart-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.chart-meta { width: 92px; flex-shrink: 0; }
.chart-label { font-size: 10.5px; color: var(--text-muted); margin-bottom: 1px; }
.chart-val { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.25; }
.chart { flex: 1; height: 38px; min-width: 80px; display: block; }
/* ── ComfyUI 更新区（版本检查 / 一键更新）── */
.up-sec { margin: 10px 0 2px; }
.up-head { font-size: 12px; font-weight: 600; margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
pre.uplog {
  margin: 6px 0 0; padding: 6px 8px; border-radius: 7px; max-height: 120px; overflow: auto;
  background: rgba(127,127,127,.08); font-size: 10.5px; line-height: 1.45;
  white-space: pre-wrap; word-break: break-all; font-variant-numeric: tabular-nums;
}
pre.uplog:empty { display: none; }
/* ── 折叠区（ComfyUI 状态 / 监视器）与本面板小部件 ── */
details.fold { margin: 2px 0 10px; }
details.fold > summary { list-style: none; cursor: pointer; user-select: none; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::marker { content: ""; }
.fold-head { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; padding: 2px 0; }
.fold-head:hover .fold-title { color: var(--accent); }
.fold-title { font-size: 12.5px; font-weight: 700; }
.fold-body { padding-top: 4px; }
.arrow { margin-left: auto; color: var(--text-muted); font-size: 10px; line-height: 1; transition: transform .15s; }
details.fold[open] > summary .arrow { transform: rotate(90deg); }
/* 状态信号灯：灰=读取中，红=异常，绿=正常；金色 ✦=有更新 */
.sig { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; line-height: 1; }
.sig.ok { background: var(--ok); }
.sig.bad { background: var(--bad); }
.sig.update { width: auto; height: auto; background: transparent; color: var(--gold); text-shadow: 0 0 4px rgba(184,134,11,.45); font-family: "Segoe UI Symbol", "Segoe UI", sans-serif; }
/* 监视器折叠后的一行温度（复用 v-temp 数据；展开时隐藏，图表行里已有温度） */
.mon-temp { flex-basis: 100%; display: flex; align-items: baseline; gap: 6px; padding: 2px 0 0; }
details.fold[open] .mon-temp { display: none; }
/* note 区里的轻量快捷操作按钮（启动失败 → 重启中继） */
button.mini { width: auto; padding: 3px 12px; font-size: 11px; }
</style>
</head>
<body>
  <details class="fold" id="fold-status">
    <summary class="fold-head">
      <span class="sig" id="sig-dot" title="状态：读取中…"></span>
      <span class="fold-title">ComfyUI 状态</span>
      <span class="arrow" aria-hidden="true">▸</span>
    </summary>
    <div class="fold-body">
      <div class="sect">
        <div class="row"><span class="k">中继</span><span class="v" id="p-phase">读取中…</span></div>
        <div class="row"><span class="k">服务端口</span><span class="v" id="p-port">—</span></div>
        <div class="row"><span class="k">后端</span><span class="v" id="p-backend">—</span></div>
        <div class="row"><span class="k">ComfyUI</span><span class="v" id="p-ver">—</span></div>
        <div class="row"><span class="k">队列</span><span class="v" id="p-queue">—</span></div>
      </div>
      <div class="up-sec">
        <div class="up-head"><span>ComfyUI 更新</span><span class="sec-spacer"></span><span class="chip" id="u-state">—</span></div>
        <div class="row"><span class="k">版本</span><span class="v" id="u-local">—</span></div>
        <div class="btn-row" style="margin-top:6px">
          <button id="u-check" title="git fetch 后与远端对比 commit（不做任何改动）">检查更新</button>
          <button id="u-apply" class="primary" title="停服务 → git pull --ff-only → pip install -r requirements.txt（后台执行）">更新</button>
        </div>
        <div class="note" id="u-note"></div>
        <pre class="uplog" id="u-log"></pre>
      </div>
      <div class="note" id="p-detail"></div>
    </div>
  </details>
  <details class="fold" id="fold-mon">
    <summary class="fold-head">
      <span class="fold-title">监视器</span>
      <span class="arrow" aria-hidden="true">▸</span>
      <span class="mon-temp" id="mon-temp"><span class="chart-label">温度</span><span class="chart-val" id="mon-temp-v">—</span></span>
    </summary>
    <div class="fold-body">
      <div class="mon-sec"><span id="m-gpu-name">GPU</span><span class="sec-spacer"></span><button class="gpu-release" id="m-release" title="让 ComfyUI 卸载全部模型、释放显存（后端 /free）">释放显存</button></div>
      <div class="chart-row"><div class="chart-meta"><div class="chart-label">GPU 利用率</div><div class="chart-val" id="v-util">—</div></div><canvas class="chart" id="c-util"></canvas></div>
      <div class="chart-row"><div class="chart-meta"><div class="chart-label">显存</div><div class="chart-val" id="v-vram">—</div></div><canvas class="chart" id="c-vram"></canvas></div>
      <div class="chart-row"><div class="chart-meta"><div class="chart-label">温度</div><div class="chart-val" id="v-temp">—</div></div><canvas class="chart" id="c-temp"></canvas></div>
      <div class="chart-row"><div class="chart-meta"><div class="chart-label">功耗</div><div class="chart-val" id="v-pwr">—</div></div><canvas class="chart" id="c-pwr"></canvas></div>
      <div class="chart-row"><div class="chart-meta"><div class="chart-label">CPU</div><div class="chart-val" id="v-cpu">—</div></div><canvas class="chart" id="c-cpu"></canvas></div>
      <div class="chart-row"><div class="chart-meta"><div class="chart-label">内存</div><div class="chart-val" id="v-ram">—</div></div><canvas class="chart" id="c-ram"></canvas></div>
      <div class="note" id="m-note"></div>
    </div>
  </details>

  <div class="btn-row" style="margin-top:10px">
    <button id="p-start" class="primary" title="按本机探测到的安装根拉起 ComfyUI（由计划任务以当前用户身份起，独立于 Hana 存活）">启动服务</button>
    <button id="p-stop" class="danger" title="终止 8188 上的 ComfyUI 进程（正在跑的任务会中断）">停止服务</button>
  </div>
  <button id="p-retry" style="margin-top:6px" title="只重启本 App 的中继（受管 runtime，随 Hana 生命周期），不影响 ComfyUI 服务本身">重启中继</button>
  <div class="note" id="p-note" style="display:none"></div>
  <div id="p-note-actions" style="display:none;margin-top:6px">
    <button id="p-note-retry" class="mini" title="只重启本 App 的中继（受管 runtime，随 Hana 生命周期），不影响 ComfyUI 服务本身">重启中继</button>
  </div>
  <div class="err" id="p-err"></div>
  <script type="module" src="./assets/panel-status.js"></script>
</body>
</html>
